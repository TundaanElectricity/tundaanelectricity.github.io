# Keeps the free Supabase project from pausing (it pauses after 7 days with no activity).
# Runs automatically every 3 days. You can also run it by hand:
# GitHub → Actions → "Keep Supabase awake" → Run workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 1 */3 * *"   # every 3 days, 9:17 AM Philippine time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mfobaxrqtwcsaqujvube.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: sb_publishable_8FrBVLnBwckbNU1cB7TZ-g_7SFPDuJo")
          echo "Supabase answered HTTP $code"
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            echo "::error::Supabase did not answer. It may be paused - open the Supabase dashboard and click Restore."
            exit 1
          fi
